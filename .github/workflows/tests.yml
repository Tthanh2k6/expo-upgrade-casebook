name: Run test suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Jest & Android Export (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create env file
        run: |
          touch .env
          echo "DEV_FIREBASE_URL_PREFIX=${{ secrets.DEV_FIREBASE_URL_PREFIX }}" >> .env

      - name: Run Jest suite
        env:
          APP_ENV: development
          EXPO_NO_TELEMETRY: '1'
        run: npx jest --ci --coverage=false

      - name: Export Android bundle
        env:
          APP_ENV: development
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir /tmp/android-export
